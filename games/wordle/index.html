<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121213">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <title>Wordle</title>
  <style>
    :root {
      --bg: #121213;
      --border: #3a3a3c;
      --key: #818384;
      --text: #ffffff;
      --accent: #b59f3b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    /* ---------- header ---------- */
    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.6rem;
      letter-spacing: 0.15em;
    }

    #hard-btn {
      justify-self: start;
      padding: 6px 12px;
      border: 2px solid var(--border);
      border-radius: 16px;
      background: transparent;
      color: var(--text);
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    #hard-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    #restart-btn {
      justify-self: end;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    #restart-btn svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- board ---------- */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      position: relative;
    }

    #board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 5px;
      padding: 10px;
      height: 100%;
      max-height: 420px;
      aspect-ratio: 5 / 6;
      max-width: 100%;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .tile {
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .tile.filled   { border-color: #565758; }
    .tile.correct  { background: #538d4e; border-color: #538d4e; }
    .tile.present  { background: #b59f3b; border-color: #b59f3b; }
    .tile.absent   { background: #3a3a3c; border-color: #3a3a3c; }
    .tile.selected { border-color: #fff; }

    /* ---------- keyboard ---------- */
    #keyboard {
      padding: 8px 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .kb-row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .kb-row button {
      flex: 1;
      height: 56px;
      border: none;
      border-radius: 4px;
      background: var(--key);
      color: var(--text);
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .kb-row button.wide { flex: 1.5; font-size: 0.75rem; }
    .kb-row .spacer { flex: 0.5; }

    .kb-row button.correct { background: #538d4e; }
    .kb-row button.present { background: #b59f3b; }
    .kb-row button.absent  { background: #3a3a3c; }

    .kb-row button.pressed {
      transform: scale(0.92);
      filter: brightness(1.5);
    }

    /* ---------- animations ---------- */
    .tile.pop { animation: pop 0.2s ease-out; }
    @keyframes pop {
      0%   { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .tile.flip { animation: flip 0.5s ease-in-out; }
    @keyframes flip {
      0%   { transform: rotateX(0); }
      50%  { transform: rotateX(90deg); }
      100% { transform: rotateX(0); }
    }

    .tile.win { animation: win 0.5s ease-in-out; }
    @keyframes win {
      0%, 100% { transform: translateY(0); }
      30%      { transform: translateY(-20px); }
      60%      { transform: translateY(4px); }
      80%      { transform: translateY(-6px); }
    }

    .row.shake { animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-6px); }
      80%      { transform: translateX(6px); }
    }

    /* ---------- toast ---------- */
    #toast {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      color: #121213;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10;
    }

    #toast.show { opacity: 1; }

    /* ---------- end popup ---------- */
    #end-popup {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      z-index: 20;
    }

    #end-popup.show { display: flex; }

    #end-popup .box {
      background: #1f1f21;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 24px 40px;
      text-align: center;
      animation: box-in 0.2s ease-out;
    }

    @keyframes box-in {
      0%   { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    #end-word {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    #end-btn {
      width: 56px;
      height: 56px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    #end-btn svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <header>
    <button id="hard-btn" type="button">HARD</button>
    <h1>WORDLE</h1>
    <button id="restart-btn" type="button" aria-label="New game">
      <svg viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"/>
        <polyline points="20 3 20 8 15 8"/>
      </svg>
    </button>
  </header>

  <main>
    <div id="toast"></div>
    <div id="board">
      <div class="row"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>
      <div class="row"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>
      <div class="row"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>
      <div class="row"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>
      <div class="row"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>
      <div class="row"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>
    </div>
  </main>

  <div id="keyboard">
    <div class="kb-row">
      <button data-key="q">Q</button><button data-key="w">W</button><button data-key="e">E</button><button data-key="r">R</button><button data-key="t">T</button><button data-key="y">Y</button><button data-key="u">U</button><button data-key="i">I</button><button data-key="o">O</button><button data-key="p">P</button>
    </div>
    <div class="kb-row">
      <div class="spacer"></div>
      <button data-key="a">A</button><button data-key="s">S</button><button data-key="d">D</button><button data-key="f">F</button><button data-key="g">G</button><button data-key="h">H</button><button data-key="j">J</button><button data-key="k">K</button><button data-key="l">L</button>
      <div class="spacer"></div>
    </div>
    <div class="kb-row">
      <button data-key="enter" class="wide">ENTER</button>
      <button data-key="z">Z</button><button data-key="x">X</button><button data-key="c">C</button><button data-key="v">V</button><button data-key="b">B</button><button data-key="n">N</button><button data-key="m">M</button>
      <button data-key="backspace" class="wide">⌫</button>
    </div>
  </div>

  <div id="end-popup">
    <div class="box">
      <div id="end-word"></div>
      <button id="end-btn" type="button" aria-label="New game">
        <svg viewBox="0 0 24 24">
          <path d="M20 12a8 8 0 1 1-2.34-5.66"/>
          <polyline points="20 3 20 8 15 8"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="words.js"></script>
  <script>
    // ---------- constants & elements ----------
    const COLS = 5, ROWS = 6;
    const STORAGE_KEY = 'wordle-save';
    const ORD = ["1st", "2nd", "3rd", "4th", "5th"];
    const FLIP_STEP = 300;                              // delay between tiles (ms)
    const FLIP_END = (COLS - 1) * FLIP_STEP + 500;      // when the last tile finishes flipping (ms)

    const rows = document.querySelectorAll('.row');
    const toast = document.getElementById('toast');
    const endPopup = document.getElementById('end-popup');
    const hardBtn = document.getElementById('hard-btn');
    const keyButtons = {};
    document.querySelectorAll('#keyboard button').forEach(b => keyButtons[b.dataset.key] = b);

    document.addEventListener('touchstart', () => {}, { passive: true }); // enables :active on iOS

    // ---------- state ----------
    let answer, row, current, cursor, gameOver, busy, guesses;
    let gameId = 0;          // changes on every new game, cancels old timers
    let hardMode = false;
    let toastTimer;

    // ---------- storage ----------
    function readSave() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY));
      } catch (e) {
        return null;
      }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          answer,
          guesses: guesses.map(g => g.word),
          current,
          cursor,
          gameOver,
          hardMode
        }));
      } catch (e) {
        // storage blocked or full: the game still works, it just won't be saved
      }
    }

    function loadGame(s) {
      if (!s || s.gameOver) return false;
      if (!ANSWERS.includes(s.answer)) return false;
      if (!Array.isArray(s.guesses) || s.guesses.length >= ROWS) return false;
      if (!s.guesses.every(w => typeof w === 'string' && /^[a-z]{5}$/.test(w))) return false;
      if (s.guesses.includes(s.answer)) return false;

      answer = s.answer;
      gameId++;
      busy = false;
      gameOver = false;
      guesses = [];

      s.guesses.forEach((word, r) => {
        const result = evaluate(word);
        guesses.push({ word, result });
        const tiles = rows[r].children;
        for (let i = 0; i < COLS; i++) {
          tiles[i].textContent = word[i];
          tiles[i].classList.add('filled', result[i]);
          colorKey(word[i], result[i]);
        }
      });

      row = guesses.length;
      current = Array.isArray(s.current) && s.current.length === COLS &&
        s.current.every(c => typeof c === 'string' && /^[a-z]?$/.test(c))
        ? s.current : ["", "", "", "", ""];
      cursor = Number.isInteger(s.cursor) && s.cursor >= 0 && s.cursor < COLS ? s.cursor : 0;
      renderRow();
      return true;
    }

    // ---------- game flow ----------
    function newGame() {
      gameId++;
      answer = ANSWERS[Math.floor(Math.random() * ANSWERS.length)];
      row = 0;
      current = ["", "", "", "", ""];
      cursor = 0;
      gameOver = false;
      busy = false;
      guesses = [];

      document.querySelectorAll('.tile').forEach(t => {
        t.textContent = "";
        t.className = 'tile';
        t.style.animationDelay = "";
      });
      rows.forEach(r => r.classList.remove('shake'));
      Object.values(keyButtons).forEach(b => b.classList.remove('correct', 'present', 'absent'));
      endPopup.classList.remove('show');

      renderRow();
      save();
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function renderRow() {
      document.querySelectorAll('.tile.selected').forEach(t => t.classList.remove('selected'));
      if (gameOver) return;
      const tiles = rows[row].children;
      for (let i = 0; i < COLS; i++) {
        tiles[i].textContent = current[i];
        tiles[i].classList.toggle('filled', !!current[i]);
      }
      tiles[cursor].classList.add('selected');
    }

    function shakeRow() {
      const r = rows[row];
      r.classList.remove('shake');
      void r.offsetWidth;
      r.classList.add('shake');
      setTimeout(() => r.classList.remove('shake'), 400);
    }

    function popTile(tile) {
      tile.classList.remove('pop');
      void tile.offsetWidth;
      tile.classList.add('pop');
      tile.addEventListener('animationend', () => tile.classList.remove('pop'), { once: true });
    }

    function evaluate(guess) {
      const result = Array(COLS).fill('absent');
      const remaining = {};
      for (let i = 0; i < COLS; i++) {
        if (guess[i] === answer[i]) result[i] = 'correct';
        else remaining[answer[i]] = (remaining[answer[i]] || 0) + 1;
      }
      for (let i = 0; i < COLS; i++) {
        if (result[i] === 'correct') continue;
        if (remaining[guess[i]] > 0) {
          result[i] = 'present';
          remaining[guess[i]]--;
        }
      }
      return result;
    }

    function colorKey(letter, state) {
      const btn = keyButtons[letter];
      if (btn.classList.contains('correct')) return;
      if (btn.classList.contains('present') && state === 'absent') return;
      btn.classList.remove('present', 'absent');
      btn.classList.add(state);
    }

    function hardModeError(guess) {
      for (const g of guesses) {
        const need = {};
        for (let i = 0; i < COLS; i++) {
          if (g.result[i] === 'correct' && guess[i] !== g.word[i]) {
            return `${ORD[i]} letter must be ${g.word[i].toUpperCase()}`;
          }
          if (g.result[i] !== 'absent') need[g.word[i]] = (need[g.word[i]] || 0) + 1;
        }
        for (const l in need) {
          const count = guess.split(l).length - 1;
          if (count < need[l]) return `Guess must contain ${l.toUpperCase()}`;
        }
      }
      return null;
    }

    function submit() {
      if (current.some(c => !c)) {
        shakeRow();
        showToast("Not enough letters");
        return;
      }
      const guess = current.join("");

      if (!VALID_GUESSES.has(guess)) {
        shakeRow();
        showToast("Not in word list");
        return;
      }
      if (hardMode) {
        const err = hardModeError(guess);
        if (err) {
          shakeRow();
          showToast(err);
          return;
        }
      }

      const result = evaluate(guess);
      guesses.push({ word: guess, result });
      const tiles = rows[row].children;
      const id = gameId;
      busy = true;

      for (let i = 0; i < COLS; i++) {
        const t = tiles[i];
        t.style.animationDelay = (i * FLIP_STEP) + 'ms';
        t.classList.add('flip');
        setTimeout(() => {
          if (id === gameId) t.classList.add(result[i]);
        }, i * FLIP_STEP + 250);
      }

      setTimeout(() => {
        if (id !== gameId) return;
        for (let i = 0; i < COLS; i++) colorKey(guess[i], result[i]);
        busy = false;
      }, FLIP_END);

      if (guess === answer || row === ROWS - 1) {
        gameOver = true;
        const won = guess === answer;

        if (won) {
          setTimeout(() => {
            if (id !== gameId) return;
            for (let i = 0; i < COLS; i++) {
              tiles[i].classList.remove('flip');
              tiles[i].style.animationDelay = (i * 100) + 'ms';
              tiles[i].classList.add('win');
            }
          }, FLIP_END);
        }

        setTimeout(() => {
          if (id !== gameId) return;
          document.getElementById('end-word').textContent = answer;
          endPopup.classList.add('show');
        }, FLIP_END + (won ? 700 : 100));
      } else {
        row++;
        current = ["", "", "", "", ""];
        cursor = 0;
      }

      renderRow();
      save();
    }

    function handleKey(key) {
      if (gameOver || busy) return;

      if (key === 'enter') {
        submit();
      } else if (key === 'backspace') {
        if (current[cursor]) current[cursor] = "";
        else if (cursor > 0) { cursor--; current[cursor] = ""; }
        renderRow();
        save();
      } else {
        current[cursor] = key;
        const tile = rows[row].children[cursor];
        if (cursor < COLS - 1) cursor++;
        renderRow();
        save();
        popTile(tile);
      }
    }

    // ---------- input ----------
    document.getElementById('keyboard').addEventListener('pointerdown', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      e.preventDefault();
      btn.classList.add('pressed');
      setTimeout(() => btn.classList.remove('pressed'), 80);
      handleKey(btn.dataset.key);
    });

    document.getElementById('board').addEventListener('pointerdown', e => {
      const tile = e.target.closest('.tile');
      if (!tile || gameOver || busy) return;
      if (tile.parentElement !== rows[row]) return;
      cursor = [...tile.parentElement.children].indexOf(tile);
      renderRow();
      save();
    });

    hardBtn.addEventListener('click', () => {
      hardMode = !hardMode;
      hardBtn.classList.toggle('active', hardMode);
      save();
    });

    document.getElementById('restart-btn').addEventListener('click', newGame);
    document.getElementById('end-btn').addEventListener('click', newGame);

    // ---------- start ----------
    const saved = readSave();
    hardMode = !!(saved && saved.hardMode);
    hardBtn.classList.toggle('active', hardMode);
    if (!loadGame(saved)) newGame();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('SW registered'))
        .catch(err => console.error('SW failed:', err));
    }
  </script>
</body>
</html>
